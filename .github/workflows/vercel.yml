name: Wdrożenie na Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sprawdź token
        id: token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Brak sekretu VERCEL_TOKEN. Dodaj go w Settings > Secrets and variables > Actions." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Deploy (vercel CLI)
        if: steps.token.outputs.ok == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" --name interstinginvesting)
          echo "Strona: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "$url"
